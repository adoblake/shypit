name: Deploy authentication backend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secure deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:auth-server
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the server-only authentication gateway
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi
          supabase functions deploy shypit-auth --project-ref mzztaucyapmwlnuiljsv --no-verify-jwt --use-api
